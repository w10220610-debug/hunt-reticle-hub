.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {

  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";

  }

  }

  }

    height: 44px;

  }
}

svg {

  max-width: 100%;

}

#widget > svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {

}

<body>
<div id="reticle-bars-editor">
  <h2>Hunt 準星 HUB 編輯器 v3｜2560×1440 原參數版</h2>

  <div class="viz-controls">
    <label class="form-label" for="bar-select">目前橫條
      <select class="form-select" id="bar-select"></select>
    </label>
    <label class="form-label" for="bar-distance">距離（米）
      <input class="form-control" id="bar-distance" type="number" min="1" max="999" inputmode="numeric" placeholder="輸入米數">
    </label>
    <label class="form-label" for="bar-y">上下位置 <output id="bar-y-output" class="tabular-nums"></output>
      <input class="form-range" id="bar-y" type="range" min="724" max="1100" step="1">

  <div class="viz-controls">

  <h3>準星樣式與照片對照</h3>

        <option value="classic">經典十字</option>
        <option value="t">T 型準星</option>

        <option value="chevron">V 型 Chevron</option>
        <option value="bracket">框角式準星</option>

    </label>
    <label class="form-label" for="reticle-thickness">準星粗細 <output id="reticle-thickness-output" class="tabular-nums"></output>
      <input class="form-range" id="reticle-thickness" type="range" min="0.5" max="6" step="0.1" value="1.5">
    </label>
    <label class="form-label" for="reticle-font-size">距離字體大小 <output id="reticle-font-size-output" class="tabular-nums"></output>
      <input class="form-range" id="reticle-font-size" type="range" min="10" max="48" step="1" value="24">

    <label class="form-label" for="reticle-color">準星線條顏色

  </div>

  <div class="viz-controls">
    <label class="form-label" for="reticle-scale">整體尺寸 <output id="reticle-scale-output" class="tabular-nums"></output>
      <input class="form-range" id="reticle-scale" type="range" min="25" max="250" step="1" value="100">
    </label>
    <label class="form-label" for="reticle-offset-x">左右位置 <output id="reticle-offset-x-output" class="tabular-nums"></output>
      <input class="form-range" id="reticle-offset-x" type="range" min="-600" max="600" step="1" value="0">
    </label>
    <label class="form-label" for="reticle-offset-y">上下位置 <output id="reticle-offset-y-output" class="tabular-nums"></output>
      <input class="form-range" id="reticle-offset-y" type="range" min="-500" max="500" step="1" value="0">
    </label>
  </div>
  <div class="text-small text-muted">編輯座標固定為 2560×1440，中心點 X=1280、Y=720。先上傳遊戲截圖，再用「整體尺寸／左右／上下」把準星疊到照片中的原準星上，就能照著照片複製相同尺寸與位置。</div>

  <h3>人物測距儀設定</h3>
  <div class="viz-controls">
    <label class="form-label" for="rf-select">目前測距橫條
      <select class="form-select" id="rf-select"></select>
    </label>
    <label class="form-label" for="rf-distance">距離（米）
      <input class="form-control" id="rf-distance" type="number" min="1" max="999" inputmode="numeric" placeholder="輸入米數">
    </label>
    <label class="form-label" for="rf-y">上下位置 <output id="rf-y-output" class="tabular-nums"></output>
      <input class="form-range" id="rf-y" type="range" min="460" max="710" step="1">
    </label>
  </div>

  <div class="viz-controls">
    <button class="btn btn-primary" id="rf-add" type="button">新增測距橫條</button>
    <button class="btn" id="rf-delete" type="button">刪除此測距橫條</button>
    <button class="btn" id="rf-reset" type="button">重設測距儀</button>
  </div>

  <div class="viz-controls">
    <label class="form-label" for="rf-offset-x">測距儀左右位置 <output id="rf-offset-x-output" class="tabular-nums"></output>
      <input class="form-range" id="rf-offset-x" type="range" min="-300" max="300" step="1" value="0">
    </label>
    <label class="form-label" for="rf-offset-y">測距儀上下位置 <output id="rf-offset-y-output" class="tabular-nums"></output>
      <input class="form-range" id="rf-offset-y" type="range" min="-300" max="300" step="1" value="0">
    </label>
  </div>

  <h3>背景參考照片</h3>
  <div class="viz-controls">
    <label class="form-label" for="bg-upload">上傳背景照片
      <input class="form-control" id="bg-upload" type="file" accept="image/*">
    </label>
    <label class="form-label" for="bg-opacity">背景透明度 <output id="bg-opacity-output" class="tabular-nums"></output>
      <input class="form-range" id="bg-opacity" type="range" min="0" max="100" step="1" value="45">
    </label>
  </div>

  <div class="viz-controls">
    <button class="btn" id="bg-clear" type="button">清除背景照片</button>
    <button class="btn btn-primary" id="photo-calibrate" type="button">兩點校正照片準星</button>
    <div class="text-small text-muted">背景照片只作為調整參考，不會被匯出到 SVG / PNG。校正時先點照片中的準星中心，再點準星右側最外緣。</div>
  </div>

  <h3>瞄準 HUB 預設</h3>
  <div class="viz-controls">
    <label class="form-label" for="hub-name">HUB 名稱
      <input class="form-control" id="hub-name" type="text" maxlength="60" placeholder="例如：Sparks 200m 專用">
    </label>
    <label class="form-label" for="hub-gun-type">槍種
      <select class="form-select" id="hub-gun-type">
        <option value="步槍">步槍</option>
        <option value="手槍">手槍</option>
        <option value="霰彈槍">霰彈槍</option>
        <option value="特殊武器">特殊武器</option>
        <option value="其他">其他</option>
      </select>
    </label>
    <label class="form-label" for="hub-weapon-name">武器名稱
      <input class="form-control" id="hub-weapon-name" type="text" maxlength="60" placeholder="例如：Sparks LRR">
    </label>
  </div>
  <div class="viz-controls">
    <button class="btn btn-primary" id="hub-save" type="button">儲存目前 HUB</button>
    <button class="btn" id="hub-export" type="button">匯出 HUB JSON</button>
    <label class="btn" for="hub-import">匯入 HUB JSON</label>
    <input id="hub-import" type="file" accept="application/json,.json" hidden>
  </div>
  <div id="hub-list" class="hub-list" aria-live="polite"></div>

  <div class="card" id="bars-stage-wrap">
    <svg id="bars-editor-stage" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="bars-stage-title bars-stage-desc">
      <title id="bars-stage-title">可新增、刪除與拖曳的準心橫條</title>
      <desc id="bars-stage-desc">中央一百米準心固定。其他橫條可上下拖曳、輸入距離、個別刪除或新增。左側人物身高測距儀可獨立調整、增減橫條，也可以整體移動位置，並可上傳背景照片作為參考。</desc>
      <rect class="editor-bg" x="0" y="0" width="2560" height="1440"></rect>
      <image id="bars-background-image" x="0" y="0" width="2560" height="1440" preserveAspectRatio="xMidYMid slice" href="" visibility="hidden"></image>
      <g class="scope-guides" aria-hidden="true">
        <line x1="0" y1="720" x2="2560" y2="720"></line>
        <line x1="1280" y1="0" x2="1280" y2="1440"></line>
      </g>
      <g id="bars-rangefinder-static"></g>
      <g id="bars-static-reticle"></g>
      <g id="bars-dynamic-reticle"></g>
    </svg>
  </div>

  <div id="bars-status" class="text-small text-muted tabular-nums" aria-live="polite"></div>
</div>

<style>
  #reticle-bars-editor {
    display: grid;
    gap: 12px;
    width: 100%;
  }
  #reticle-bars-editor h2 {
    margin: 0;
  }
  #reticle-bars-editor h3 {
    margin: 4px 0 0;
    font-size: 1rem;
  }
  #bars-stage-wrap {
    overflow: hidden;
    padding: 0;
  }
  #bars-editor-stage {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    touch-action: none;
    user-select: none;
  }
  #bars-editor-stage .editor-bg {

  }
  #bars-editor-stage .scope-guides {
    stroke: var(--border);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  #bars-editor-stage .preview-inner {

    stroke-width: var(--reticle-inner-width, 1.5);

    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  #bars-editor-stage .preview-label {

<script>
(() => {
  const root = document.getElementById('reticle-bars-editor');
  const stage = root.querySelector('#bars-editor-stage');
  const stageWrap = root.querySelector('#bars-stage-wrap');
  const rangefinderStatic = root.querySelector('#bars-rangefinder-static');
  const staticReticle = root.querySelector('#bars-static-reticle');
  const dynamicReticle = root.querySelector('#bars-dynamic-reticle');
  const backgroundImage = root.querySelector('#bars-background-image');
  const barSelect = root.querySelector('#bar-select');
  const distanceInput = root.querySelector('#bar-distance');
  const yRange = root.querySelector('#bar-y');
  const yOutput = root.querySelector('#bar-y-output');
  const status = root.querySelector('#bars-status');
  const addButton = root.querySelector('#bar-add');
  const deleteButton = root.querySelector('#bar-delete');
  const resetButton = root.querySelector('#bar-reset');
  const svgButton = root.querySelector('#bar-download-svg');
  const pngButton = root.querySelector('#bar-download-png');

  const rfSelect = root.querySelector('#rf-select');
  const rfDistanceInput = root.querySelector('#rf-distance');
  const rfYRange = root.querySelector('#rf-y');
  const rfYOutput = root.querySelector('#rf-y-output');
  const rfAddButton = root.querySelector('#rf-add');
  const rfDeleteButton = root.querySelector('#rf-delete');
  const rfResetButton = root.querySelector('#rf-reset');
  const rfOffsetXRange = root.querySelector('#rf-offset-x');
  const rfOffsetYRange = root.querySelector('#rf-offset-y');
  const rfOffsetXOutput = root.querySelector('#rf-offset-x-output');
  const rfOffsetYOutput = root.querySelector('#rf-offset-y-output');

  const bgUploadInput = root.querySelector('#bg-upload');
  const bgOpacityRange = root.querySelector('#bg-opacity');
  const bgOpacityOutput = root.querySelector('#bg-opacity-output');
  const bgClearButton = root.querySelector('#bg-clear');
  const photoCalibrateButton = root.querySelector('#photo-calibrate');

  const reticleStyleSelect = root.querySelector('#reticle-style');
  const reticleThicknessRange = root.querySelector('#reticle-thickness');
  const reticleThicknessOutput = root.querySelector('#reticle-thickness-output');
  const reticleFontSizeRange = root.querySelector('#reticle-font-size');
  const reticleFontSizeOutput = root.querySelector('#reticle-font-size-output');
  const reticleColorInput = root.querySelector('#reticle-color');
  const reticleScaleRange = root.querySelector('#reticle-scale');
  const reticleScaleOutput = root.querySelector('#reticle-scale-output');
  const reticleOffsetXRange = root.querySelector('#reticle-offset-x');
  const reticleOffsetYRange = root.querySelector('#reticle-offset-y');
  const reticleOffsetXOutput = root.querySelector('#reticle-offset-x-output');
  const reticleOffsetYOutput = root.querySelector('#reticle-offset-y-output');

  const hubNameInput = root.querySelector('#hub-name');
  const hubGunTypeSelect = root.querySelector('#hub-gun-type');
  const hubWeaponNameInput = root.querySelector('#hub-weapon-name');
  const hubSaveButton = root.querySelector('#hub-save');
  const hubExportButton = root.querySelector('#hub-export');
  const hubImportInput = root.querySelector('#hub-import');
  const hubList = root.querySelector('#hub-list');

  const initialBars = [
    { id: 1, distance: '150', y: 752 },
    { id: 2, distance: '170', y: 761 },
    { id: 3, distance: '200', y: 773 },
    { id: 4, distance: '', y: 792 },
    { id: 5, distance: '', y: 814 },
    { id: 6, distance: '', y: 837 },
    { id: 7, distance: '330', y: 860 }
  ];

  const initialRangefinder = {
    offsetX: 0,
    offsetY: 0,
    marks: [
      { id: 1, distance: '100', y: 500 },
      { id: 2, distance: '150', y: 573.333 },
      { id: 3, distance: '170', y: 590.587 },
      { id: 4, distance: '200', y: 610 },
      { id: 5, distance: '330', y: 653.333 }
    ]
  };

  let bars = cloneInitial();
  let selectedId = 1;
  let nextId = 8;
  let dragging = null;

  let rangefinder = cloneRangefinderInitial();
  let selectedRfId = 1;
  let nextRfId = 6;
  let backgroundState = { href: '', opacity: 0.45 };
  let reticleStyle = 'sparks';
  let reticleAppearance = { thickness: 1.5, fontSize: 24, color: '#b6ff3b' };
  let reticleTransform = { scale: 1, offsetX: 0, offsetY: 0 };
  const HUB_STORAGE_KEY = 'hunt-reticle-hub-presets-v2';
  let photoCalibration = null;

  function cloneInitial() {
    return initialBars.map(bar => ({ ...bar }));
  }

  function cloneRangefinderInitial() {
    return {
      offsetX: initialRangefinder.offsetX,
      offsetY: initialRangefinder.offsetY,
      marks: initialRangefinder.marks.map(mark => ({ ...mark }))
    };
  }

  function linePair(x1, y1, x2, y2) {
    return `<line class="preview-inner" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  }

  function pathPair(d) {
    return `<path class="preview-inner" d="${d}"></path>`;
  }

  function circlePair(cx, cy, r) {
    return `<circle class="preview-inner" cx="${cx}" cy="${cy}" r="${r}"></circle>`;
  }

  function reticleShapeMarkup(lastY) {
    switch (reticleStyle) {
      case 'classic': return pathPair(`M1200 720H1268 M1292 720H1360 M1280 640V708 M1280 732V${lastY}`);
      case 't': return pathPair(`M1200 720H1268 M1292 720H1360 M1280 732V${lastY}`);
      case 'dot': return circlePair(1280, 720, 5) + pathPair(`M1280 736V${lastY}`);
      case 'chevron': return pathPair(`M1248 736L1280 704L1312 736 M1280 736V${lastY}`);
      case 'bracket': return pathPair(`M1215 690V720H1250 M1345 690V720H1310 M1280 738V${lastY}`);
      default: return pathPair(`M1224 720H1273.333 M1286.667 720H1336 M1280 664V713.333 M1280 726.667V${lastY}`);
    }
  }

  function reticleTransformValue() {
    return `translate(${reticleTransform.offsetX} ${reticleTransform.offsetY}) translate(1280 720) scale(${reticleTransform.scale}) translate(-1280 -720)`;
  }

  function selectedBar() {
    return bars.find(bar => bar.id === selectedId) || null;
  }

  function selectedRangefinderMark() {
    return rangefinder.marks.find(mark => mark.id === selectedRfId) || null;
  }

  function displayName(bar, index) {
    return bar.distance ? `${bar.distance} 米` : `橫條 ${index + 1}（未標示）`;
  }

  function displayRangefinderName(mark, index) {
    return mark.distance ? `${mark.distance} 米` : `測距橫條 ${index + 1}（未標示）`;
  }

  function makeOptions() {
    if (!bars.length) {
      barSelect.innerHTML = '<option value="">沒有橫條</option>';
      barSelect.disabled = true;
      return;
    }
    barSelect.disabled = false;
    barSelect.innerHTML = bars.map((bar, index) => `<option value="${bar.id}">${displayName(bar, index)}</option>`).join('');
    barSelect.value = String(selectedId);
  }

  function makeRangefinderOptions() {
    if (!rangefinder.marks.length) {
      rfSelect.innerHTML = '<option value="">沒有測距橫條</option>';
      rfSelect.disabled = true;
      return;
    }
    rfSelect.disabled = false;
    rfSelect.innerHTML = rangefinder.marks.map((mark, index) => `<option value="${mark.id}">${displayRangefinderName(mark, index)}</option>`).join('');
    rfSelect.value = String(selectedRfId);
  }

  function render() {
    if (backgroundState.href) {
      backgroundImage.setAttributeNS('http://www.w3.org/1999/xlink', 'href', backgroundState.href);
      backgroundImage.setAttribute('href', backgroundState.href);
      backgroundImage.setAttribute('visibility', 'visible');
      backgroundImage.style.opacity = String(backgroundState.opacity);
    } else {
      backgroundImage.setAttribute('visibility', 'hidden');
      backgroundImage.removeAttribute('href');
      backgroundImage.removeAttributeNS('http://www.w3.org/1999/xlink', 'href');
    }

    stage.style.setProperty('--reticle-inner-width', `${reticleAppearance.thickness}px`);
    stage.style.setProperty('--reticle-color', reticleAppearance.color || '#b6ff3b');
    stage.style.setProperty('--reticle-font-size', `${reticleAppearance.fontSize}px`);

    const rangefinderTransform = `translate(${rangefinder.offsetX} ${rangefinder.offsetY})`;
    const rangefinderMarksMarkup = rangefinder.marks.map(mark => {
      const isActive = mark.id === selectedRfId;
      const label = mark.distance ? `<text class="preview-label" x="${mark.y === 500 ? 928 : 933.333}" y="${mark.y + 6}">${mark.distance}</text>` : '';
      const halfWidth = mark.y === 500 ? 24 : 18.667;
      return `<g data-rf-id="${mark.id}" aria-label="${mark.distance ? `${mark.distance} 米` : '未標示'}測距橫條，Y ${Math.round(mark.y)}">
        <rect class="drag-hit" x="915" y="${mark.y - 18}" width="140" height="36"></rect>
        ${linePair(1000 - halfWidth, mark.y, 1000 + halfWidth, mark.y)}
        ${label}
        ${isActive ? `<circle class="drag-handle" cx="${1000 + halfWidth}" cy="${mark.y}" r="8"></circle>` : ''}
      </g>`;
    }).join('');

    rangefinderStatic.innerHTML = `<g transform="${rangefinderTransform}">${pathPair('M1000 500V720 M968 720H1032')}${rangefinderMarksMarkup}</g>`;

    const lastY = bars.length ? Math.max(...bars.map(bar => bar.y)) : 726.667;
    const mainTransform = reticleTransformValue();
    staticReticle.setAttribute('transform', mainTransform);
    dynamicReticle.setAttribute('transform', mainTransform);
    staticReticle.innerHTML = reticleShapeMarkup(lastY) + '<text class="preview-label" x="1188" y="708">100</text>';

    dynamicReticle.innerHTML = bars.map((bar, index) => {
      const active = bar.id === selectedId;
      const labelX = index % 2 === 0 ? 1315 : 1212;
      const label = bar.distance ? `<text class="preview-label" x="${labelX}" y="${bar.y + 6}">${bar.distance}</text>` : '';
      return `<g data-bar-id="${bar.id}" aria-label="${bar.distance ? `${bar.distance} 米` : '未標示'}橫條，Y ${Math.round(bar.y)}">
        <rect class="drag-hit" x="1230" y="${bar.y - 27}" width="180" height="54"></rect>
        ${linePair(1260, bar.y, 1300, bar.y)}
        ${label}
        ${active ? `<circle class="drag-handle" cx="1300" cy="${bar.y}" r="8"></circle>` : ''}
      </g>`;
    }).join('');

    const bar = selectedBar();
    const disabled = !bar;
    distanceInput.disabled = disabled;
    yRange.disabled = disabled;
    deleteButton.disabled = disabled;
    if (bar) {
      barSelect.value = String(bar.id);
      distanceInput.value = bar.distance;
      yRange.value = String(Math.round(bar.y));
      yOutput.value = `${Math.round(bar.y)} px`;
    } else {
      distanceInput.value = '';
      yOutput.value = '';
    }

    const rfMark = selectedRangefinderMark();
    const rfDisabled = !rfMark;
    rfDistanceInput.disabled = rfDisabled;
    rfYRange.disabled = rfDisabled;
    rfDeleteButton.disabled = rfDisabled;
    if (rfMark) {
      rfSelect.value = String(rfMark.id);
      rfDistanceInput.value = rfMark.distance;
      rfYRange.value = String(Math.round(rfMark.y));
      rfYOutput.value = `${Math.round(rfMark.y)} px`;
    } else {
      rfDistanceInput.value = '';
      rfYOutput.value = '';
    }

    rfOffsetXRange.value = String(Math.round(rangefinder.offsetX));
    rfOffsetYRange.value = String(Math.round(rangefinder.offsetY));
    rfOffsetXOutput.value = `${Math.round(rangefinder.offsetX)} px`;
    rfOffsetYOutput.value = `${Math.round(rangefinder.offsetY)} px`;

    bgOpacityRange.value = String(Math.round(backgroundState.opacity * 100));
    bgOpacityOutput.value = `${Math.round(backgroundState.opacity * 100)}%`;

    reticleStyleSelect.value = reticleStyle;
    reticleThicknessRange.value = String(reticleAppearance.thickness);
    reticleThicknessOutput.value = `${reticleAppearance.thickness.toFixed(1)} px`;
    reticleFontSizeRange.value = String(reticleAppearance.fontSize);
    reticleFontSizeOutput.value = `${Math.round(reticleAppearance.fontSize)} px`;
    reticleColorInput.value = /^#[0-9a-fA-F]{6}$/.test(reticleAppearance.color || '') ? reticleAppearance.color : '#b6ff3b';
    reticleScaleRange.value = String(Math.round(reticleTransform.scale * 100));
    reticleScaleOutput.value = `${Math.round(reticleTransform.scale * 100)}%`;
    reticleOffsetXRange.value = String(Math.round(reticleTransform.offsetX));
    reticleOffsetYRange.value = String(Math.round(reticleTransform.offsetY));
    reticleOffsetXOutput.value = `${Math.round(reticleTransform.offsetX)} px`;
    reticleOffsetYOutput.value = `${Math.round(reticleTransform.offsetY)} px`;

    const barText = bar ? `${bar.distance ? `${bar.distance} 米` : '未標示橫條'}｜中心線下方 ${Math.round(bar.y - 720)} px` : '目前沒有可調整的準心橫條';
    const rfText = rfMark ? `${rfMark.distance ? `${rfMark.distance} 米` : '未標示測距橫條'}｜測距儀內 Y ${Math.round(rfMark.y)} px｜整體偏移 X ${Math.round(rangefinder.offsetX)} / Y ${Math.round(rangefinder.offsetY)}` : '目前沒有可調整的測距橫條';
    status.textContent = `2560×1440｜中心 X1280 / Y720 ｜ ${barText} ｜ ${rfText}`;
  }

  function selectBar(id) {
    selectedId = Number(id);
    render();
  }

  function selectRangefinderMark(id) {
    selectedRfId = Number(id);
    render();
  }

  function setSelectedY(value) {
    const bar = selectedBar();
    if (!bar) return;
    bar.y = Math.max(724, Math.min(1100, Number(value)));
    render();
  }

  function setSelectedRangefinderY(value) {
    const mark = selectedRangefinderMark();
    if (!mark) return;
    mark.y = Math.max(460, Math.min(710, Number(value)));
    render();
  }

  function svgPoint(event) {
    const point = stage.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    return point.matrixTransform(stage.getScreenCTM().inverse());
  }

  function addBar() {
    const greatestY = bars.length ? Math.max(...bars.map(bar => bar.y)) : 740;
    const bar = { id: nextId++, distance: '', y: Math.min(1100, greatestY + 22) };
    bars.push(bar);
    selectedId = bar.id;
    makeOptions();
    render();
    distanceInput.focus();
  }

  function addRangefinderMark() {
    const greatestY = rangefinder.marks.length ? Math.max(...rangefinder.marks.map(mark => mark.y)) : 560;
    const mark = { id: nextRfId++, distance: '', y: Math.min(710, greatestY + 22) };
    rangefinder.marks.push(mark);
    selectedRfId = mark.id;
    makeRangefinderOptions();
    render();
    rfDistanceInput.focus();
  }

  function deleteSelectedBar() {
    const index = bars.findIndex(bar => bar.id === selectedId);
    if (index < 0) return;
    bars.splice(index, 1);
    if (bars.length) selectedId = bars[Math.min(index, bars.length - 1)].id;
    makeOptions();
    render();
  }

  function deleteSelectedRangefinderMark() {
    const index = rangefinder.marks.findIndex(mark => mark.id === selectedRfId);
    if (index < 0) return;
    rangefinder.marks.splice(index, 1);
    if (rangefinder.marks.length) selectedRfId = rangefinder.marks[Math.min(index, rangefinder.marks.length - 1)].id;
    makeRangefinderOptions();
    render();
  }

  function exportLine(x1, y1, x2, y2) {
    return `<line class="inner" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }

  function exportPath(d) {
    return `<path class="inner" d="${d}"/>`;
  }

  function exportCircle(cx, cy, r) {
    return `<circle class="inner" cx="${cx}" cy="${cy}" r="${r}"/>`;
  }

  function exportReticleShape(lastY) {
    switch (reticleStyle) {
      case 'classic': return exportPath(`M1200 720H1268 M1292 720H1360 M1280 640V708 M1280 732V${lastY}`);
      case 't': return exportPath(`M1200 720H1268 M1292 720H1360 M1280 732V${lastY}`);
      case 'dot': return exportCircle(1280, 720, 5) + exportPath(`M1280 736V${lastY}`);
      case 'chevron': return exportPath(`M1248 736L1280 704L1312 736 M1280 736V${lastY}`);
      case 'bracket': return exportPath(`M1215 690V720H1250 M1345 690V720H1310 M1280 738V${lastY}`);
      default: return exportPath(`M1224 720H1273.333 M1286.667 720H1336 M1280 664V713.333 M1280 726.667V${lastY}`);
    }
  }

  function buildExportSvg() {
    const lastY = bars.length ? Math.max(...bars.map(bar => bar.y)) : 726.667;
    const barMarkup = bars.map((bar, index) => {
      const labelX = index % 2 === 0 ? 1315 : 1212;
      const label = bar.distance ? `<text class="label" x="${labelX}" y="${bar.y + 5.333}">${bar.distance}</text>` : '';
      return `<g id="bar-${index + 1}" data-distance="${bar.distance}">${exportLine(1260, bar.y, 1300, bar.y)}${label}</g>`;
    }).join('');
    const rangefinderMarksMarkup = rangefinder.marks.map((mark, index) => {
      const labelX = mark.y === 500 ? 928 : 933.333;
      const halfWidth = mark.y === 500 ? 24 : 18.667;
      const label = mark.distance ? `<text class="label" x="${labelX}" y="${mark.y + 5.333}">${mark.distance}</text>` : '';
      return `<g id="rangefinder-bar-${index + 1}" data-distance="${mark.distance}">${exportLine(1000 - halfWidth, mark.y, 1000 + halfWidth, mark.y)}${label}</g>`;
    }).join('');
    return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>Custom multi-bar Hunt Sparks reticle</title>
<defs><style>.inner{fill:none;stroke:${/^#[0-9a-fA-F]{6}$/.test(reticleAppearance.color || '') ? reticleAppearance.color : '#b6ff3b'};stroke-width:${reticleAppearance.thickness};stroke-linecap:round;stroke-linejoin:round}.label{fill:${/^#[0-9a-fA-F]{6}$/.test(reticleAppearance.color || '') ? reticleAppearance.color : '#b6ff3b'};stroke:none;font-family:"Segoe UI",sans-serif;font-size:${reticleAppearance.fontSize}px;font-weight:700}</style></defs>
<g id="vertical-rangefinder" transform="translate(${rangefinder.offsetX} ${rangefinder.offsetY})">${exportPath('M1000 500V720 M968 720H1032')}${rangefinderMarksMarkup}</g>
<g id="reticle" transform="${reticleTransformValue()}">${exportReticleShape(lastY)}<text class="label" x="1194.667" y="708">100</text>${barMarkup}</g>
</svg>`;
  }

  function getHubPresets() {
    try {
      const raw = localStorage.getItem(HUB_STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) { return []; }
  }

  function setHubPresets(items) {
    try { localStorage.setItem(HUB_STORAGE_KEY, JSON.stringify(items)); } catch (_) {}
  }

  function currentHubSnapshot() {
    return {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      name: hubNameInput.value.trim() || '未命名 HUB',
      gunType: hubGunTypeSelect.value,
      weaponName: hubWeaponNameInput.value.trim(),
      createdAt: new Date().toISOString(),
      reticleStyle,
      reticleAppearance: { ...reticleAppearance },
      reticleTransform: { ...reticleTransform },
      bars: bars.map(item => ({ ...item })),
      rangefinder: { offsetX: rangefinder.offsetX, offsetY: rangefinder.offsetY, marks: rangefinder.marks.map(item => ({ ...item })) }
    };
  }

  function applyHubPreset(preset) {
    if (!preset || typeof preset !== 'object') return;
    reticleStyle = preset.reticleStyle || 'sparks';
    reticleAppearance = { thickness: Number(preset.reticleAppearance?.thickness) || 1.5, fontSize: Number(preset.reticleAppearance?.fontSize) || 24, color: /^#[0-9a-fA-F]{6}$/.test(preset.reticleAppearance?.color || '') ? preset.reticleAppearance.color : '#b6ff3b' };
    reticleTransform = { scale: Number(preset.reticleTransform?.scale) || 1, offsetX: Number(preset.reticleTransform?.offsetX) || 0, offsetY: Number(preset.reticleTransform?.offsetY) || 0 };
    if (Array.isArray(preset.bars)) bars = preset.bars.map(item => ({ ...item }));
    if (preset.rangefinder?.marks && Array.isArray(preset.rangefinder.marks)) rangefinder = { offsetX: Number(preset.rangefinder.offsetX) || 0, offsetY: Number(preset.rangefinder.offsetY) || 0, marks: preset.rangefinder.marks.map(item => ({ ...item })) };
    nextId = Math.max(0, ...bars.map(item => Number(item.id) || 0)) + 1;
    nextRfId = Math.max(0, ...rangefinder.marks.map(item => Number(item.id) || 0)) + 1;
    selectedId = bars[0]?.id ?? 0;
    selectedRfId = rangefinder.marks[0]?.id ?? 0;
    hubNameInput.value = preset.name || '';
    hubGunTypeSelect.value = preset.gunType || '其他';
    hubWeaponNameInput.value = preset.weaponName || '';
    makeOptions(); makeRangefinderOptions(); render();
  }

  function renderHubList() {
    const items = getHubPresets();
    hubList.replaceChildren();
    if (!items.length) {
      const empty = document.createElement('div'); empty.className = 'text-small text-muted'; empty.textContent = '目前還沒有儲存的 HUB。'; hubList.appendChild(empty); return;
    }
    items.forEach(item => {
      const row = document.createElement('div'); row.className = 'hub-item';
      const main = document.createElement('div'); main.className = 'hub-item-main';
      const title = document.createElement('div'); title.className = 'hub-item-title'; title.textContent = item.name || '未命名 HUB';
      const meta = document.createElement('div'); meta.className = 'hub-item-meta'; meta.textContent = `${item.gunType || '未分類'}${item.weaponName ? `｜${item.weaponName}` : ''}｜${item.reticleStyle || 'sparks'}`;
      main.append(title, meta);
      const load = document.createElement('button'); load.type = 'button'; load.className = 'btn'; load.textContent = '載入'; load.addEventListener('click', () => applyHubPreset(item));
      const del = document.createElement('button'); del.type = 'button'; del.className = 'btn'; del.textContent = '刪除'; del.addEventListener('click', () => { setHubPresets(getHubPresets().filter(x => x.id !== item.id)); renderHubList(); });
      row.append(main, load, del); hubList.appendChild(row);
    });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function chooseSaveHandle(suggestedName, description, mimeType, extension) {
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        return await window.showSaveFilePicker({
          suggestedName,
          types: [{ description, accept: { [mimeType]: [extension] } }]
        });
      } catch (error) {
        if (error && error.name === 'AbortError') return false;
      }
    }
    const enteredName = window.prompt('請輸入檔案名稱', suggestedName);
    if (enteredName === null) return false;
    const fallbackName = enteredName.toLowerCase().endsWith(extension) ? enteredName : `${enteredName}${extension}`;
    return { fallbackName };
  }

  async function saveBlob(blob, handle, fallbackName) {
    if (handle === false) return;
    if (handle && handle.fallbackName) {
      downloadBlob(blob, handle.fallbackName);
      return;
    }
    if (handle) {
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }
    downloadBlob(blob, fallbackName);
  }

  async function downloadSvg() {
    const filename = 'Hunt-Sparks-custom-bars-2560x1440.svg';
    const handle = await chooseSaveHandle(filename, 'SVG 準心', 'image/svg+xml', '.svg');
    const blob = new Blob([buildExportSvg()], { type: 'image/svg+xml;charset=utf-8' });
    await saveBlob(blob, handle, filename);
  }

  async function downloadPng() {
    const filename = 'Hunt-Sparks-custom-bars-2560x1440.png';
    const handle = await chooseSaveHandle(filename, '透明 PNG 準心', 'image/png', '.png');
    if (handle === false) return;
    const svgBlob = new Blob([buildExportSvg()], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 2560;
      canvas.height = 1440;
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0);
      canvas.toBlob(async blob => {
        if (blob) await saveBlob(blob, handle, filename);
        URL.revokeObjectURL(url);
      }, 'image/png');
    };
    image.onerror = () => URL.revokeObjectURL(url);
    image.src = url;
  }

  stage.addEventListener('pointerdown', event => {
    if (photoCalibration) {
      const point = svgPoint(event);
      if (photoCalibration.step === 1) {
        photoCalibration.center = { x: point.x, y: point.y };
        photoCalibration.step = 2;
        status.textContent = '校正第 2 步：請點照片中準星右側最外緣';
      } else {
        const dx = point.x - photoCalibration.center.x;
        const dy = point.y - photoCalibration.center.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const baseRadius = reticleStyle === 'classic' || reticleStyle === 't' ? 80 : reticleStyle === 'chevron' ? 45 : reticleStyle === 'bracket' ? 65 : 56;
        reticleTransform.scale = Math.max(0.25, Math.min(2.5, distance / baseRadius));
        reticleTransform.offsetX = Math.max(-600, Math.min(600, photoCalibration.center.x - 1280));
        reticleTransform.offsetY = Math.max(-500, Math.min(500, photoCalibration.center.y - 720));
        photoCalibration = null;
        photoCalibrateButton.textContent = '兩點校正照片準星';
        render();
        status.textContent = '照片校正完成：已套用準星中心位置與整體尺寸，可再用滑桿微調。';
      }
      event.preventDefault();
      return;
    }
    const rangefinderGroup = event.target.closest('[data-rf-id]');
    if (rangefinderGroup) {
      const id = Number(rangefinderGroup.dataset.rfId);
      selectRangefinderMark(id);
      const mark = selectedRangefinderMark();
      const point = svgPoint(event);
      dragging = { pointerId: event.pointerId, type: 'rf', offsetY: mark.y - (point.y - rangefinder.offsetY) };
      stage.setPointerCapture(event.pointerId);
      event.preventDefault();
      return;
    }
    const group = event.target.closest('[data-bar-id]');
    if (!group) return;
    const id = Number(group.dataset.barId);
    selectBar(id);
    const bar = selectedBar();
    const point = svgPoint(event);
    dragging = { pointerId: event.pointerId, type: 'bar', offsetY: bar.y - point.y };
    stage.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  stage.addEventListener('pointermove', event => {
    if (!dragging || dragging.pointerId !== event.pointerId) return;
    const point = svgPoint(event);
    if (dragging.type === 'rf') {
      setSelectedRangefinderY(point.y - rangefinder.offsetY + dragging.offsetY);
    } else {
      setSelectedY(point.y + dragging.offsetY);
    }
    event.preventDefault();
  });

  function endDrag(event) {
    if (!dragging || dragging.pointerId !== event.pointerId) return;
    if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
    dragging = null;
  }

  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  barSelect.addEventListener('change', () => selectBar(barSelect.value));
  distanceInput.addEventListener('input', () => {
    const bar = selectedBar();
    if (!bar) return;
    bar.distance = distanceInput.value.replace(/[^0-9]/g, '').slice(0, 3);
    makeOptions();
    render();
    distanceInput.focus();
  });
  yRange.addEventListener('input', () => setSelectedY(yRange.value));
  addButton.addEventListener('click', addBar);
  deleteButton.addEventListener('click', deleteSelectedBar);
  resetButton.addEventListener('click', () => {
    bars = cloneInitial();
    selectedId = 1;
    nextId = 8;
    makeOptions();
    render();
  });

  rfSelect.addEventListener('change', () => selectRangefinderMark(rfSelect.value));
  rfDistanceInput.addEventListener('input', () => {
    const mark = selectedRangefinderMark();
    if (!mark) return;
    mark.distance = rfDistanceInput.value.replace(/[^0-9]/g, '').slice(0, 3);
    makeRangefinderOptions();
    render();
    rfDistanceInput.focus();
  });
  rfYRange.addEventListener('input', () => setSelectedRangefinderY(rfYRange.value));
  rfAddButton.addEventListener('click', addRangefinderMark);
  rfDeleteButton.addEventListener('click', deleteSelectedRangefinderMark);
  rfResetButton.addEventListener('click', () => {
    rangefinder = cloneRangefinderInitial();
    selectedRfId = 1;
    nextRfId = 6;
    makeRangefinderOptions();
    render();
  });
  rfOffsetXRange.addEventListener('input', () => {
    rangefinder.offsetX = Number(rfOffsetXRange.value);
    render();
  });
  rfOffsetYRange.addEventListener('input', () => {
    rangefinder.offsetY = Number(rfOffsetYRange.value);
    render();
  });

  reticleStyleSelect.addEventListener('change', () => { reticleStyle = reticleStyleSelect.value; render(); });
  reticleThicknessRange.addEventListener('input', () => { reticleAppearance.thickness = Math.max(0.5, Math.min(6, Number(reticleThicknessRange.value) || 1.5)); render(); });
  reticleFontSizeRange.addEventListener('input', () => { reticleAppearance.fontSize = Math.max(10, Math.min(48, Number(reticleFontSizeRange.value) || 24)); render(); });
  reticleColorInput.addEventListener('input', () => { reticleAppearance.color = reticleColorInput.value; render(); });
  reticleScaleRange.addEventListener('input', () => { reticleTransform.scale = Math.max(0.25, Math.min(2.5, Number(reticleScaleRange.value) / 100 || 1)); render(); });
  reticleOffsetXRange.addEventListener('input', () => { reticleTransform.offsetX = Number(reticleOffsetXRange.value) || 0; render(); });
  reticleOffsetYRange.addEventListener('input', () => { reticleTransform.offsetY = Number(reticleOffsetYRange.value) || 0; render(); });

  hubSaveButton.addEventListener('click', () => {
    const items = getHubPresets(); items.unshift(currentHubSnapshot()); setHubPresets(items.slice(0, 100)); renderHubList();
  });
  hubExportButton.addEventListener('click', () => {
    const payload = { version: 2, exportedAt: new Date().toISOString(), presets: getHubPresets() };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), 'Hunt-Reticle-HUB-presets.json');
  });
  hubImportInput.addEventListener('change', event => {
    const file = event.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || '{}'));
        const incoming = Array.isArray(parsed) ? parsed : parsed.presets;
        if (!Array.isArray(incoming)) throw new Error('格式錯誤');
        const merged = [...incoming.filter(x => x && typeof x === 'object'), ...getHubPresets()];
        setHubPresets(merged.slice(0, 100)); renderHubList(); status.textContent = `已匯入 ${incoming.length} 個 HUB 預設`;
      } catch (_) { status.textContent = 'HUB JSON 格式無法讀取'; }
      hubImportInput.value = '';
    };
    reader.readAsText(file);
  });

  photoCalibrateButton.addEventListener('click', () => {
    if (!backgroundState.href) {
      status.textContent = '請先上傳一張遊戲截圖，再使用兩點校正。';
      return;
    }
    if (photoCalibration) {
      photoCalibration = null;
      photoCalibrateButton.textContent = '兩點校正照片準星';
      status.textContent = '已取消照片準星校正。';
      return;
    }
    photoCalibration = { step: 1, center: null };
    photoCalibrateButton.textContent = '取消照片校正';
    status.textContent = '校正第 1 步：請點照片中原準星的中心點';
  });

  bgUploadInput.addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      backgroundState.href = String(reader.result || '');
      render();
    };
    reader.readAsDataURL(file);
  });
  bgOpacityRange.addEventListener('input', () => {
    backgroundState.opacity = Number(bgOpacityRange.value) / 100;
    render();
  });
  bgClearButton.addEventListener('click', () => {
    backgroundState.href = '';
    photoCalibration = null;
    photoCalibrateButton.textContent = '兩點校正照片準星';
    bgUploadInput.value = '';
    render();
  });

  svgButton.addEventListener('click', downloadSvg);
  pngButton.addEventListener('click', downloadPng);

  const resizeObserver = new ResizeObserver(entries => {
    const width = entries[0].contentRect.width;
    stage.setAttribute('viewBox', width <= 480 ? '880 450 720 540' : '860 450 800 600');
  });
  resizeObserver.observe(stageWrap);

  makeOptions();
  makeRangefinderOptions();
  renderHubList();
  render();
})();
</script>


</body>
</html>
