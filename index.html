<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hunt HUB 手機校準版</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}.top{position:sticky;top:0;z-index:9;background:#101722e8;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #263348}.title{font-weight:800;font-size:18px}.sub{font-size:12px;color:#9eb0c9}.badge{float:right;background:#1d8cff22;border:1px solid #1d8cff66;color:#70b7ff;padding:5px 9px;border-radius:999px;font-size:12px}.preview{position:sticky;top:62px;z-index:8;background:#05070a;border-bottom:1px solid #263348}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#090d12}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.status{padding:8px 14px;background:#111925;color:#aebbd0;font-size:12px}.wrap{padding:12px}.card{background:#111925;border:1px solid #263348;border-radius:16px;padding:13px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:15px}label{display:block;font-size:12px;color:#9eb0c9;margin:8px 0 4px}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;background:#0b111a;color:#fff;border:1px solid #33445e;border-radius:11px;padding:11px}input[type=range]{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #33445e;background:#182233;color:#fff;border-radius:11px;padding:11px}.primary{background:#1677ff;border-color:#1677ff}.danger{background:#35171a;border-color:#693037}.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.small{font-size:11px;color:#8191a8}.preset{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #243148}.preset:first-child{border-top:0}.preset span{flex:1}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#0e151feF;backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;border-top:1px solid #263348}.locked .editOnly{opacity:.38;pointer-events:none}.locked .stage svg{pointer-events:none}.hidden{display:none}
</style></head><body><header class="top"><span id="badge" class="badge">編輯中</span><div class="title">Hunt HUB 手機校準版</div><div class="sub">先確認準星設計流程，再製作 Windows Overlay</div></header><section class="preview"><div class="stage" id="stage"><img id="bg" class="hidden"><svg id="svg" viewBox="0 0 2560 1440"><line x1="1280" y1="0" x2="1280" y2="1440" stroke="#2e3b50" stroke-dasharray="8 12"/><line x1="0" y1="720" x2="2560" y2="720" stroke="#2e3b50" stroke-dasharray="8 12"/><g id="reticle"></g></svg></div><div id="status" class="status">編輯模式：調整會即時反映在上方準星。</div></section><main class="wrap editOnly"><section class="card"><h3>HUB 資料</h3><label>HUB 名稱</label><input id="name" type="text" placeholder="例如 Sparks 200m"><label>槍種</label><select id="gun"><option>步槍</option><option>狙擊槍</option><option>手槍</option><option>霰彈槍</option><option>其他</option></select><label>武器名稱</label><input id="weapon" type="text" placeholder="例如 Sparks LRR"></section><section class="card"><h3>橫條標記</h3><label>目前橫條</label><select id="barSel"></select><div class="row"><div><label>距離標籤</label><input id="dist" type="number" min="0" max="999"></div><div><label>精確 Y 座標</label><input id="yNum" type="number" min="650" max="1250"></div></div><label>Y 軸位置</label><input id="y" type="range" min="650" max="1250" step="1"><div class="nudge"><button class="btn" data-dy="-5">Y −5</button><button class="btn" data-dy="-1">Y −1</button><button class="btn" data-dy="1">Y +1</button><button class="btn" data-dy="5">Y +5</button></div><div class="row" style="margin-top:8px"><button id="add" class="btn">＋新增橫條</button><button id="del" class="btn danger">刪除此橫條</button></div></section><section class="card"><h3>準星外觀</h3><label>樣式</label><select id="style"><option value="multi">Sparks 多橫條</option><option value="cross">經典十字</option><option value="t">T 型</option><option value="dot">中心點＋垂直線</option><option value="chev">Chevron</option></select><label>線條粗細</label><input id="thick" type="range" min="1" max="8" step=".5" value="2"><label>整體縮放</label><input id="scale" type="range" min="25" max="250" value="100"><div class="row"><div><label>X 偏移</label><input id="ox" type="number" value="0"></div><div><label>Y 偏移</label><input id="oy" type="number" value="0"></div></div></section><section class="card"><h3>背景參考照片</h3><input id="photo" type="file" accept="image/*"><label>照片透明度</label><input id="op" type="range" min="10" max="100" value="70"><button id="clear" class="btn" style="width:100%;margin-top:8px">清除照片</button><div class="small">背景只用於校準，不會存進準星。</div></section><section class="card"><h3>HUB 預設</h3><button id="save" class="btn primary" style="width:100%">儲存目前 HUB</button><div id="list"></div></section></main><nav class="bottom"><button id="new" class="btn">＋新增</button><button id="edit" class="btn">修改</button><button id="done" class="btn primary">完成並鎖定</button></nav><script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';let bars=[{id:1,d:'150',y:752},{id:2,d:'170',y:761},{id:3,d:'200',y:773},{id:4,d:'',y:792},{id:5,d:'',y:814},{id:6,d:'',y:837},{id:7,d:'330',y:860}],sel=1,next=8,active=null,locked=false;const key='hunt-hub-mobile-v2';function presets(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function setPresets(x){localStorage.setItem(key,JSON.stringify(x))}function bar(){return bars.find(x=>x.id==sel)}function opts(){barSel.innerHTML=bars.map((b,i)=>`<option value="${b.id}">橫條 ${i+1}${b.d?' · '+b.d+'m':''}</option>`).join('');barSel.value=sel;sync()}function sync(){let b=bar();if(!b)return;dist.value=b.d;y.value=yNum.value=b.y}function line(x1,y1,x2,y2,w){let e=document.createElementNS(NS,'line');for(let[k,v]of Object.entries({x1,y1,x2,y2}))e.setAttribute(k,v);e.setAttribute('stroke','#fff');e.setAttribute('stroke-width',w);e.setAttribute('stroke-linecap','round');return e}function render(){let g=$('#reticle');g.innerHTML='';let w=+thick.value,s=+scale.value/100,dx=+ox.value||0,dy=+oy.value||0;g.setAttribute('transform',`translate(${1280+dx} ${720+dy}) scale(${s}) translate(-1280 -720)`);let st=style.value;if(st==='cross'||st==='multi'){g.append(line(1160,720,1240,720,w));g.append(line(1320,720,1400,720,w));g.append(line(1280,650,1280,790,w))}if(st==='t'){g.append(line(1170,720,1390,720,w));g.append(line(1280,720,1280,850,w))}if(st==='dot'){let c=document.createElementNS(NS,'circle');c.setAttribute('cx',1280);c.setAttribute('cy',720);c.setAttribute('r',5+w);c.setAttribute('fill','#fff');g.append(c);g.append(line(1280,735,1280,900,w))}if(st==='chev'){g.append(line(1235,745,1280,700,w));g.append(line(1280,700,1325,745,w));g.append(line(1280,700,1280,860,w))}if(st==='multi')bars.forEach(b=>{let grp=document.createElementNS(NS,'g');grp.dataset.id=b.id;grp.append(line(1230,b.y,1330,b.y,w));if(b.d){let t=document.createElementNS(NS,'text');t.setAttribute('x',1345);t.setAttribute('y',b.y+8);t.setAttribute('fill','#fff');t.setAttribute('font-size',24);t.textContent=b.d;grp.append(t)}g.append(grp)})}function snapshot(){return{id:active||Date.now(),name:name.value||'未命名 HUB',gun:gun.value,weapon:weapon.value,style:style.value,thick:thick.value,scale:scale.value,ox:ox.value,oy:oy.value,bars:bars.map(x=>({...x})),updated:Date.now()}}function saveNow(){let a=presets(),x=snapshot(),i=a.findIndex(p=>p.id===x.id);if(i>=0)a[i]=x;else a.unshift(x);active=x.id;setPresets(a.slice(0,50));list()}function load(p){active=p.id;name.value=p.name||'';gun.value=p.gun||'步槍';weapon.value=p.weapon||'';style.value=p.style||'multi';thick.value=p.thick||2;scale.value=p.scale||100;ox.value=p.ox||0;oy.value=p.oy||0;bars=(p.bars||bars).map(x=>({...x}));sel=bars[0]?.id||1;next=Math.max(0,...bars.map(x=>x.id))+1;opts();render();setLock(true)}function list(){let a=presets();$('#list').innerHTML=a.length?a.map(p=>`<div class="preset"><span><b>${p.name}</b><br><small>${p.weapon||p.gun||''}</small></span><button class="btn" data-load="${p.id}">載入</button><button class="btn danger" data-del="${p.id}">刪除</button></div>`).join(''):'<div class="small" style="margin-top:9px">尚未儲存 HUB</div>'}function setLock(v){locked=v;document.body.classList.toggle('locked',v);badge.textContent=v?'已鎖定':'編輯中';edit.disabled=!v;done.disabled=v;status.textContent=v?'HUB 已完成並鎖定；按「修改」才可再次調整。':'編輯模式：調整會即時反映在上方準星。'}
barSel.onchange=()=>{sel=+barSel.value;sync()};dist.oninput=()=>{bar().d=dist.value;opts();render()};function setY(v){bar().y=Math.max(650,Math.min(1250,+v||720));sync();render()}y.oninput=()=>setY(y.value);yNum.oninput=()=>setY(yNum.value);document.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>setY(bar().y+(+b.dataset.dy)));add.onclick=()=>{let b=bar(),n={id:next++,d:'',y:Math.min(1250,(b?.y||720)+20)};bars.push(n);sel=n.id;opts();render()};del.onclick=()=>{if(bars.length<=1)return;bars=bars.filter(x=>x.id!==sel);sel=bars[0].id;opts();render()};[style,thick,scale,ox,oy].forEach(e=>e.oninput=render);photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{bg.src=r.result;bg.classList.remove('hidden')};r.readAsDataURL(f)};op.oninput=()=>bg.style.opacity=op.value/100;clear.onclick=()=>{bg.src='';bg.classList.add('hidden');photo.value=''};save.onclick=saveNow;$('#list').onclick=e=>{let id=+(e.target.dataset.load||e.target.dataset.del||0);if(!id)return;let a=presets();if(e.target.dataset.load)load(a.find(x=>x.id===id));else{setPresets(a.filter(x=>x.id!==id));if(active===id)active=null;list()}};edit.onclick=()=>setLock(false);done.onclick=()=>{saveNow();setLock(true)};new.onclick=()=>{active=null;name.value='';weapon.value='';bars=[{id:1,d:'150',y:752},{id:2,d:'170',y:761},{id:3,d:'200',y:773}];sel=1;next=4;opts();render();setLock(false);scrollTo({top:0,behavior:'smooth'})};opts();list();render();setLock(false);
</script></body></html>
